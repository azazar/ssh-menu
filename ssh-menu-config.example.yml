# ~/.ssh/ssh-menu-config.yml
# F9 edits this file and validates/reloads it after saving. Existing files are
# never overwritten on upgrade; merge desired profiles/recipes from the defaults.
# Commands and scripts are trusted shell code. Checks and generators run locally.
#
# Profile fields: name (unique), command (required), key, available_command,
# inputs, and arbitrary string fields referenced by %{field}.
# default names a profile. Left/Right changes only the selected host's profile.
#
# Templates: %h = user@host; %p = explicit port or empty; %t = user@host[:port];
# %{field} = another string field; %{input:id} = dialog value; %% = literal %.
# Substitutions are shell-escaped: leave placeholders UNQUOTED. A remote command
# needs a quoting layer at each shell boundary; see remote/script fields below.
# Fields without %{...} references stay literal (including shell expressions).
# Optional-port templates preserve SSH alias settings when no port was entered.
#
# Profile key: Ctrl+, Alt+, or Ctrl+Alt+ plus A-Z. Plain text remains filter input.
# Keys must not duplicate another profile or a menu action, even if unavailable.
# Ctrl+H/I/J/M/S/Z are reserved for terminal aliases and flow/suspend behavior.
# Setup recipes cannot define keys. Ctrl+Q has no built-in action.
#
# available_command: quick, noninteractive local sh -c check, without placeholders.
# Exit 0 keeps the entry; other statuses hide it. Profile checks run at load/reload;
# setup checks run when F4 opens. No check means always available. Output is ignored.
# These checks do not test remote connectivity or remote tool availability.
default: SSH
# Binding reference: omitted actions keep defaults; [] disables an action.
# Uncomment entries to override them; merge within each scope, not a second map.
# Reveal actions are also available in dialog/help/editor with the same defaults.
# connect hands off; connect_and_return reopens the menu after command exit.
# Swap these actions' keys in menu and dialog to make returning the default.
keybindings:
  menu:
    # reveal_alt: [Alt+?]
    # reveal_ctrl_alt: [Ctrl+Alt+?]
    # reveal_ctrl: [Ctrl+?]
    connect: [Enter]
    connect_and_return: [Alt+Enter]
    connection_settings: [Ctrl+Enter]
    # help: [F1]
    # configure_remote: [F4]
    # new_remote: [Shift+F4]
    # edit_config: [F9]
    # toggle_transport: [F8]
    # quit: [Esc, Ctrl+C]
    # up: [Up]
    # down: [Down]
    # page_up: [PgUp]
    # page_down: [PgDn]
    # left: [Left]
    # right: [Right]
    # erase_character: [Backspace, Delete]
    # erase_word: [Ctrl+Backspace, Ctrl+Delete]
  dialog:
    connect: [Enter]
    connect_and_return: [Alt+Enter]
    # help: [F1]
    # cancel: [Esc, Ctrl+C]
    # next_field: [Tab, Down]
    # previous_field: [Shift+Tab, Up]
    # left: [Left]
    # right: [Right]
    # erase_character: [Backspace, Delete]
    # erase_word: [Ctrl+Backspace, Ctrl+Delete]
  # help:
    # help: [F1] # Toggle help closed
    # close: [Esc, Ctrl+C, Q]
    # next_topic: [Right, Tab]
    # previous_topic: [Left, Shift+Tab]
    # up: [Up]
    # down: [Down]
    # page_up: [PgUp]
    # page_down: [PgDn, Space]
    # home: [Home]
    # end: [End]
  # editor:
    # help: [F1]
    # edit: [Enter, F9]
    # cancel: [Esc, Ctrl+C]

profiles:
  - name: SSH
    key: Alt+S
    available_command: command -v ssh
    command: port=%p; exec ssh ${port:+-p "$port"} -- %h
  - name: Mosh
    key: Alt+M
    available_command: command -v mosh
    command: port=%p; exec mosh ${port:+--ssh="ssh -p $port"} -- %h
  - name: MC
    key: Alt+C
    available_command: command -v mc
    command: mc /sh://%t/
  - name: Bash
    key: Alt+B
    available_command: command -v ssh
    command: port=%p; exec ssh ${port:+-p "$port"} -tt -- %h %{remote}
    remote: exec bash -l
  - name: Zellij
    key: Alt+Z
    available_command: command -v ssh
    command: port=%p; exec ssh ${port:+-p "$port"} -tt -- %h %{remote}
    remote: sh -c %{script}
    script: |
      #!/bin/sh
      # Runs on the SSH server with its terminal still attached to stdin.
      set -eu
      fail() { printf 'ssh-menu: %s\n' "$*" >&2; exit 1; }

      if command -v zellij >/dev/null 2>&1; then
          zellij_bin=$(command -v zellij)
      elif [ -x "$HOME/.local/bin/zellij" ]; then
          zellij_bin=$HOME/.local/bin/zellij
      else
          case "$(uname -s):$(uname -m)" in
              Linux:x86_64)
                  platform=x86_64-unknown-linux-musl
                  expected=d006c521dcb475a6005d741e9dd7c5758e5a23b28dd60a5c10cebfa4876319dd
                  ;;
              Linux:aarch64|Linux:arm64)
                  platform=aarch64-unknown-linux-musl
                  expected=2a2c0621e6f3b11ecbb05d66939a48000a2508604620aa20727a5fd61c49f451
                  ;;
              *) fail 'automatic Zellij installation supports Linux x86-64/ARM64; install zellij manually on this platform' ;;
          esac
          command -v tar >/dev/null 2>&1 || fail 'tar is required to install Zellij'
          if command -v sha256sum >/dev/null 2>&1; then
              checksum=sha256sum
          elif command -v shasum >/dev/null 2>&1; then
              checksum=shasum
          else
              fail 'sha256sum or shasum is required to verify Zellij'
          fi
          umask 077
          mkdir -p "$HOME/.local/bin"
          install_dir=$(mktemp -d "$HOME/.local/bin/.ssh-menu-zellij.XXXXXX")
          trap 'rm -rf "$install_dir"' 0
          trap 'exit 1' HUP INT TERM
          archive=$install_dir/zellij.tar.gz
          url=https://github.com/zellij-org/zellij/releases/download/v0.45.1/zellij-$platform.tar.gz
          printf 'Installing Zellij 0.45.1 into %s/.local/bin ...\n' "$HOME" >&2
          if command -v curl >/dev/null 2>&1; then
              curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --location \
                  --retry 2 --connect-timeout 15 --max-time 180 --silent --show-error \
                  --output "$archive" "$url" || fail 'Zellij download failed'
          elif command -v wget >/dev/null 2>&1; then
              wget --https-only --timeout=30 --tries=2 -q -O "$archive" "$url" || fail 'Zellij download failed'
          else
              fail 'curl or wget is required to download Zellij'
          fi
          # Official .sha256sum assets hash the executable, not the tarball.
          tar -xzf "$archive" -C "$install_dir" zellij || fail 'cannot extract Zellij'
          [ -f "$install_dir/zellij" ] && [ ! -L "$install_dir/zellij" ] || fail 'invalid Zellij archive member'
          if [ "$checksum" = sha256sum ]; then
              digest=$(sha256sum "$install_dir/zellij")
          else
              digest=$(shasum -a 256 "$install_dir/zellij")
          fi
          [ "${digest%% *}" = "$expected" ] || fail 'Zellij checksum mismatch; refusing to install or execute it'
          chmod 755 "$install_dir/zellij"
          mv -f "$install_dir/zellij" "$HOME/.local/bin/zellij"
          rm -rf "$install_dir"
          trap - 0 HUP INT TERM
          zellij_bin=$HOME/.local/bin/zellij
      fi

      # Names are returned without formatting, oldest session first. Keep spaces intact.
      # When no sessions exist, list-sessions returns nonzero; attach --create handles it.
      if sessions=$("$zellij_bin" list-sessions --short --no-formatting 2>/dev/null); then
          session=$(printf '%s\n' "$sessions" | sed -n '1p')
          if [ -n "$session" ]; then
              exec "$zellij_bin" attach --create "$session"
          fi
      fi
      exec "$zellij_bin" attach --create

  # Persistent sessions, file transfers, monitoring and SSH forwarding.
  - name: Tmux
    key: Alt+T
    available_command: command -v ssh
    command: port=%p; exec ssh ${port:+-p "$port"} -tt -- %h %{remote}
    remote: exec tmux new-session -A -s main
  - name: SFTP
    key: Alt+F
    available_command: command -v sftp
    command: port=%p; exec sftp ${port:+-P "$port"} -- %h
  - name: Monitor
    key: Alt+H
    available_command: command -v ssh
    command: port=%p; exec ssh ${port:+-p "$port"} -tt -- %h %{remote}
    remote: sh -c %{script} -- %{dashboard}
    # A compact health overview. Press 4 in btop to toggle the process list,
    # i for disk read/write graphs, and n/b to cycle network interfaces.
    dashboard: |
      shown_boxes = "cpu mem net"
      update_ms = 1000
      theme_background = false
      graph_symbol = "block"
      show_uptime = true
      check_temp = true
      show_gpu_info = "On"
      show_disks = true
      only_physical = false
      disks_filter = "exclude=/proc /dev /dev/pts /dev/shm /sys /sys/fs/cgroup /run /run/lock"
      use_fstab = false
      show_io_stat = true
      io_mode = false
      net_auto = true
      show_swap = true
    script: |
      set -eu
      command -v btop >/dev/null 2>&1 || {
        echo 'Monitor requires btop on the remote. Use F4 > Install terminal tools > btop, or install it with the remote package manager.' >&2
        exit 1
      }
      # Isolate the dashboard from the user's regular btop configuration.
      umask 077
      config_dir=$(mktemp -d "${TMPDIR:-/tmp}/ssh-menu-monitor.XXXXXX")
      trap 'rm -rf "$config_dir"' 0
      trap 'exit 1' HUP INT TERM
      mkdir -p "$config_dir/btop"
      printf '%s\n' "$1" > "$config_dir/btop/btop.conf"
      XDG_CONFIG_HOME="$config_dir" XDG_STATE_HOME="$config_dir" btop
  - name: Tunnel
    key: Ctrl+Alt+L
    available_command: command -v ssh
    inputs:
      - id: forward
        type: promptString
        description: Local port:destination host:port
        default: '8080:localhost:80'
        required: true
    # The destination is reached from the SSH server; listen only on loopback.
    command: |
      port=%p
      forward=%{input:forward}
      printf 'Forwarding 127.0.0.1:%s through SSH. Ctrl+C stops the tunnel.\n' "$forward"
      exec ssh ${port:+-p "$port"} -N -T -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -L "127.0.0.1:$forward" -- %h
  - name: SOCKS
    key: Ctrl+Alt+D
    available_command: command -v ssh
    inputs:
      - id: port
        type: promptString
        description: Local SOCKS port
        default: '1080'
        required: true
    command: |
      port=%p
      listen=%{input:port}
      printf 'SOCKS proxy on 127.0.0.1:%s. Ctrl+C stops the proxy.\n' "$listen"
      exec ssh ${port:+-p "$port"} -N -T -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -D "127.0.0.1:$listen" -- %h

# F4 configures the selected host; Shift+F4 opens Add new to add and connect.
# You can also switch between these modes using the Action field.
# Configure host runs one recipe and returns to the menu without saving history.
# None is selected by default; a recipe is required only in Configure host mode.
# Same command templates and named fields as launch profiles; runs locally.
configuration_scripts:
  - name: Configure key-based auth
    inputs:
      - &ssh_key
        id: key
        type: pickString
        description: SSH keypair
        required: true
        # Emit YAML. Only list public keys with a matching private-key file.
        command: |
          found=0
          printf 'options:\n'
          for public in "$HOME"/.ssh/id_*.pub; do
            [ -f "$public" ] && [ -f "${public%.pub}" ] || continue
            name=${public##*/}
            escaped=$(printf '%s' "$name" | sed "s/'/''/g")
            printf "  - '%s'\n" "$escaped"
            found=1
          done
          [ "$found" = 1 ] || printf "  - 'Generate new Ed25519 key'\n"
    command: |
      set -eu
      port=%p
      key=$(sh -c %{prepare_key} -- %{input:key})
      exec ssh-copy-id ${port:+-p "$port"} -i "$key" %h
    # Only runs after confirming setup, with the terminal restored for prompts.
    prepare_key: &prepare_ssh_key |
      set -eu
      if [ "$1" = 'Generate new Ed25519 key' ]; then
        private="$HOME/.ssh/id_ed25519"
        for file in "$private" "$private.pub"; do
          if [ -e "$file" ] || [ -L "$file" ]; then
            echo "Cannot generate a new key: $file already exists. Restore the matching key file or select another keypair." >&2
            exit 1
          fi
        done
        umask 077
        mkdir -p "$HOME/.ssh"
        echo "Generating $private (ssh-keygen will ask for a passphrase)." >&2
        ssh-keygen -q -t ed25519 -f "$private" >&2
        public="$private.pub"
      else
        public="$HOME/.ssh/$1"
      fi
      [ -f "$public" ] && [ -f "${public%.pub}" ] || {
        echo "Missing SSH keypair: $public" >&2
        exit 1
      }
      printf '%s\n' "$public"
  - name: Configure key-based auth + install dotfiles
    prepare_key: *prepare_ssh_key
    # Relative source paths are resolved under local $HOME.
    inputs:
      - *ssh_key
      - id: source
        type: promptString
        description: Local dotfiles directory
        default: src/dotfiles
        required: true
      - id: installer
        type: promptString
        description: Installer filename
        default: install.sh
        required: true
      - id: shell
        type: pickString
        description: Installer shell
        options: [sh, bash]
        default: sh
    command: |
      set -eu
      port=%p
      source=%{input:source}
      installer=%{input:installer}
      case "$source" in /*) ;; *) source="$HOME/$source" ;; esac
      test -f "$source/$installer" || { echo "Missing $source/$installer" >&2; exit 1; }
      key=$(sh -c %{prepare_key} -- %{input:key})
      ssh-copy-id ${port:+-p "$port"} -i "$key" %h
      ssh ${port:+-p "$port"} -- %h 'mkdir -p "$HOME/src/dotfiles"'
      scp ${port:+-P "$port"} -r "$source/." %h:src/dotfiles/
      ssh ${port:+-p "$port"} -tt -- %h %{remote}
    remote: sh -c %{script} -- %{input:installer} %{input:shell}
    script: |
      set -eu
      cd "$HOME/src/dotfiles"
      exec "$2" "./$1"
  - name: Install terminal tools
    available_command: command -v ssh
    inputs:
      - id: tools
        type: pickString
        description: Remote packages
        options: ['tmux + btop', tmux, btop, htop, mosh, mc]
        default: 'tmux + btop'
    command: port=%p; exec ssh ${port:+-p "$port"} -tt -- %h %{remote}
    remote: sh -c %{script} -- %{input:tools}
    script: |
      set -eu
      case "$1" in
        'tmux + btop') set -- tmux btop ;;
        tmux|htop|btop|mosh|mc) set -- "$1" ;;
        *) echo 'Unknown terminal tools selection.' >&2; exit 1 ;;
      esac
      # Use the remote's repositories and normal package-manager prompts.
      if command -v brew >/dev/null 2>&1; then
        exec brew install "$@"
      elif command -v apt-get >/dev/null 2>&1; then
        set -- apt-get install "$@"
      elif command -v dnf >/dev/null 2>&1; then
        set -- dnf install "$@"
      elif command -v yum >/dev/null 2>&1; then
        set -- yum install "$@"
      elif command -v pacman >/dev/null 2>&1; then
        set -- pacman -S --needed "$@"
      elif command -v zypper >/dev/null 2>&1; then
        set -- zypper install "$@"
      elif command -v apk >/dev/null 2>&1; then
        set -- apk add "$@"
      else
        echo 'No supported package manager found; install the tools manually.' >&2
        exit 1
      fi
      if [ "$(id -u)" = 0 ]; then
        exec "$@"
      fi
      command -v sudo >/dev/null 2>&1 || {
        echo 'Installing system packages requires root or sudo.' >&2
        exit 1
      }
      exec sudo -- "$@"
  - name: Copy terminal definition
    available_command: command -v ssh && command -v infocmp && test -n "${TERM:-}"
    # Export before connecting so a failed infocmp cannot send a partial definition.
    command: |
      set -eu
      port=%p
      definition=$(infocmp -x -- "$TERM")
      printf '%s\n' "$definition" | ssh ${port:+-p "$port"} -- %h %{remote}
    remote: sh -c %{script}
    script: |
      set -eu
      command -v tic >/dev/null 2>&1 || {
        echo 'Install ncurses tic on the remote first.' >&2
        exit 1
      }
      umask 077
      source=$(mktemp "${TMPDIR:-/tmp}/ssh-menu-terminfo.XXXXXX")
      trap 'rm -f "$source"' 0
      trap 'exit 1' HUP INT TERM
      cat > "$source"
      mkdir -p "$HOME/.terminfo"
      tic -x -o "$HOME/.terminfo" "$source"

# Custom profiles and recipes (merge into the named sections above; these
# commented fragments are not active). Fields display plain text, not passwords.
# Inputs: id (unique letters/digits/_/-), type (promptString or pickString),
# description, default, required, options (pickString only), command (generator).
# promptString defaults to empty; pickString defaults to its first option.
# Generators emit a YAML/JSON mapping of default/options/description (max 64 KiB).
# Successful values are cached while a dialog is open; errors block submission.
# Generators run locally with stdin closed and no placeholder substitution.
# Pass remote inputs as positional arguments through remote/script quoting layers.
# Input values are temporary and never saved to YAML or history.

