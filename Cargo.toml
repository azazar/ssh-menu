[package]
name = "ssh-menu"
version = "0.1.0-rc.1"
edition = "2024"
license = "GPL-3.0-only"
description = "A fast SSH and Mosh connection picker built with Ratatui"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
shell-words = "1.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
