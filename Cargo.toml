[package]
name = "shui"
version = "0.1.0-rc.5"
edition = "2024"
license = "GPL-3.0-only"
description = "Shui (Shell UI): a fast SSH and Mosh connection picker built with Ratatui"

[dependencies]
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
tui-markdown = { version = "0.3.11", default-features = false }
crossterm = "0.29.0"
shell-words = "1.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
