name: Binaries

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            cross: true
            smoke: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
            cross: true
            smoke: false
          - target: armv7-unknown-linux-musleabihf
            runner: ubuntu-24.04
            cross: true
            smoke: false
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            cross: false
            smoke: true
          - target: aarch64-apple-darwin
            runner: macos-15
            cross: false
            smoke: true
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            cross: false
            smoke: true
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            cross: false
            smoke: true
    env:
      TARGET: ${{ matrix.target }}
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Test platform installer
        if: matrix.smoke
        run: python tests/install.py
      - name: Install pinned Rust toolchain and target
        run: |
          rustup show
          rustup target add "$TARGET"
      - name: Install Linux cross compiler
        if: matrix.cross
        run: cargo install cross --version 0.2.5 --locked
      - name: Build static Linux executable
        if: matrix.cross
        run: cross build --locked --release --target "$TARGET"
      - name: Run shared keyboard and UI tests on Linux target
        if: matrix.cross
        timeout-minutes: 10
        run: |
          for suite in action_tests bar::tests bindings::tests help::tests new_remote::tests shortcut::tests alternate_clients; do
            cross test --locked --target "$TARGET" "$suite" -- --test-threads=1
          done
      - name: Build native executable
        if: ${{ !matrix.cross }}
        run: cargo build --locked --release --target "$TARGET"
      - name: Verify Linux static linkage
        if: runner.os == 'Linux'
        run: |
          binary="target/$TARGET/release/shui"
          file "$binary"
          if readelf -l "$binary" | grep -q INTERP; then
            echo 'Unexpected dynamic interpreter' >&2
            exit 1
          fi
          if readelf -d "$binary" | grep -q NEEDED; then
            echo 'Unexpected shared-library dependency' >&2
            exit 1
          fi
      - name: Smoke test native executable
        if: matrix.smoke
        run: |
          binary="target/$TARGET/release/shui"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          "$binary" --version
          "$binary" --help
          python tests/cli.py "$binary"
      - name: Native unit tests
        if: ${{ !matrix.cross }}
        run: cargo test --locked --target "$TARGET"
      - name: macOS lint and terminal integration tests
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          cargo clippy --locked --target "$TARGET" --all-targets -- -D warnings
          python -m pip install pyte==0.8.2
          python tests/zellij.py
          python -u tests/terminal.py "target/$TARGET/release/shui"
      - name: Package binary and documentation
        run: python scripts/package.py "$TARGET"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: shui-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: shui-*
          path: dist
          merge-multiple: true
      - name: Combine archive checksums
        run: cat dist/*.sha256 > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v3.0.3
        with:
          # Immutable releases must receive all assets before publication.
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false
