# $XDG_CONFIG_HOME/shui.yml (default: ~/.config/shui.yml)
# F9 edits this file and validates/reloads it after saving. Existing files are
# never overwritten on upgrade; merge desired profiles/recipes from the defaults.
# Commands and scripts are trusted shell code. Checks and generators run locally.
#
# Profile fields: name (unique), command (required), key, available_command,
# prepare_command, inputs, and arbitrary string fields referenced by %{field}.
# default names a profile. Left/Right changes only the selected host's profile.
#
# Templates: %h = user@host; %p = explicit port or empty; %t = user@host[:port];
# %{field} = another string field; %{input:id} = dialog value; %% = literal %.
# Substitutions are shell-escaped: leave placeholders UNQUOTED. A remote command
# needs a quoting layer at each shell boundary; see remote/script fields below.
# Fields without %{...} references stay literal (including shell expressions).
# Optional-port templates preserve SSH alias settings when no port was entered.
#
# Profile key: Ctrl+, Alt+, or Ctrl+Alt+ plus A-Z. Plain text remains filter input.
# Keys must not duplicate another profile or a menu action, even if unavailable.
# Ctrl+H/I/J/M/S/Z are reserved for terminal aliases and flow/suspend behavior.
# Setup recipes cannot define keys. Ctrl+Q has no built-in action.
#
# available_command: quick, noninteractive local sh -c check, without placeholders.
# Exit 0 keeps the entry; other statuses hide it. Profile checks run at load/reload;
# setup checks run when F4 opens. No check means always available. Output is ignored.
# Checks time out after five seconds; input generators have the same timeout
# and a 64 KiB limit on each output stream. They have no controlling terminal
# on Unix, so prompts cannot interfere with the menu.
# These checks do not test remote connectivity or remote tool availability.
# Default profiles instead offer dependency installation when launched.
# prepare_command runs locally with the terminal restored, before setup/connect/history.
# Exit 0 continues; any failure/cancellation returns to the menu. It supports %h,
# %p, %t and named fields, but not dialog inputs. It is only for launch profiles.
# Remote requirements are checked inside the remote command (Mosh uses a preliminary
# SSH session). Helpers ask before installing and verify the executable afterward.
# YAML *ensure/*install aliases refer to anchors in SSH; copy those fields too
# when adopting an individual profile in an existing config.
default: SSH
# auto: show usernames only to distinguish accounts for the same host/port.
# always: show known usernames; never: hide the username column.
# This affects display only. Matching configured usernames are omitted in commands.
username_display: auto
# Binding reference: omitted actions keep defaults; [] disables an action.
# Uncomment entries to override them; merge within each scope, not a second map.
# Reveal actions are also available in dialog/help/editor with the same defaults.
# connect hands off; connect_and_return reopens the menu after command exit.
# Swap these actions' keys in menu and dialog to make returning the default.
keybindings:
  menu:
    # reveal_alt: [Alt+?]
    # reveal_ctrl_alt: [Ctrl+Alt+?]
    # reveal_ctrl: [Ctrl+?]
    # reveal_shift: [Shift+F1]
    connect: [Enter]
    connect_and_return: [Alt+Enter]
    connection_settings: [Ctrl+Enter]
    # help: [F1]
    # configure_remote: [F4]
    # new_remote: [Shift+F4]
    # edit_config: [F9]
    # refresh: [F5]
    # clear_search: [Ctrl+U]
    # home: [Home]
    # end: [End]
    # toggle_transport: [F8]
    # quit: [Esc, Ctrl+C]
    # up: [Up]
    # down: [Down]
    # page_up: [PgUp]
    # page_down: [PgDn]
    # left: [Left]
    # right: [Right]
    # erase_character: [Backspace, Delete]
    # erase_word: [Ctrl+Backspace, Ctrl+Delete]
  dialog:
    connect: [Enter]
    connect_and_return: [Alt+Enter]
    # help: [F1]
    # cancel: [Esc, Ctrl+C]
    # next_field: [Tab, Down]
    # previous_field: [Shift+Tab, Up]
    # left: [Left]
    # right: [Right]
    # erase_character: [Backspace, Delete]
    # erase_word: [Ctrl+Backspace, Ctrl+Delete]
  # help:
    # help: [F1] # Toggle help closed
    # close: [Esc, Ctrl+C, Q]
    # next_topic: [Right, Tab]
    # previous_topic: [Left, Shift+Tab]
    # up: [Up]
    # down: [Down]
    # page_up: [PgUp]
    # page_down: [PgDn, Space]
    # home: [Home]
    # end: [End]
  # editor:
    # help: [F1]
    # edit: [Enter, F9]
    # cancel: [Esc, Ctrl+C]

profiles:
  - name: SSH
    key: Alt+S
    prepare_command: &prepare_ssh sh -c %{ensure} -- ssh openssh 'this machine' %{install}
    # Helpers are ordinary template fields, reused with YAML anchors below.
    ensure: &ensure |
      set -eu
      tool=$1
      package=$2
      location=$3
      command -v "$tool" >/dev/null 2>&1 && exit 0
      printf '%s is missing on %s. Install %s? [y/N] ' "$tool" "$location" "$package" >&2
      IFS= read -r answer || exit 1
      case "$answer" in y|Y|yes|YES) ;; *) echo 'Installation cancelled.' >&2; exit 1 ;; esac
      sh -c "$4" -- "$package" "$tool"
      command -v "$tool" >/dev/null 2>&1 || {
        printf '%s is still unavailable after installation. Check PATH or install it manually.\n' "$tool" >&2
        exit 1
      }
    install: &install |
      set -eu
      package=$1
      tool=$2
      # Use configured repositories; preserve package-manager and sudo prompts.
      if command -v brew >/dev/null 2>&1; then
        exec brew install "$package"
      elif command -v apt-get >/dev/null 2>&1; then
        [ "$package" != openssh ] || package=openssh-client
        set -- apt-get install "$package"
      elif command -v dnf >/dev/null 2>&1; then
        [ "$package" != openssh ] || package=openssh-clients
        set -- dnf install "$package"
      elif command -v yum >/dev/null 2>&1; then
        [ "$package" != openssh ] || package=openssh-clients
        set -- yum install "$package"
      elif command -v pacman >/dev/null 2>&1; then
        set -- pacman -S --needed "$package"
      elif command -v zypper >/dev/null 2>&1; then
        set -- zypper install "$package"
      elif command -v apk >/dev/null 2>&1; then
        if [ "$package" = openssh ]; then
          case "$tool" in sftp) package=openssh-sftp-client ;; *) package=openssh-client ;; esac
        fi
        set -- apk add "$package"
      else
        printf 'No supported package manager found. Install %s manually.\n' "$package" >&2
        exit 1
      fi
      if [ "$(id -u)" = 0 ]; then exec "$@"; fi
      command -v sudo >/dev/null 2>&1 || { echo 'Installation requires root or sudo.' >&2; exit 1; }
      exec sudo -- "$@"
    command: port=%p; exec ssh ${port:+-p "$port"} -- %h
  - name: Mosh
    key: Alt+M
    prepare_command: |
      sh -c %{ensure} -- ssh openssh 'this machine' %{install} || exit $?
      sh -c %{ensure} -- mosh mosh 'this machine' %{install} || exit $?
      port=%p
      ssh ${port:+-p "$port"} -tt -- %h %{check_remote}
    check_remote: sh -c %{ensure} -- mosh-server mosh 'the remote' %{install}
    ensure: *ensure
    install: *install
    command: port=%p; exec mosh ${port:+--ssh="ssh -p $port"} -- %h
  - name: MC
    key: Alt+C
    prepare_command: |
      sh -c %{ensure} -- ssh openssh 'this machine' %{install} || exit $?
      sh -c %{ensure} -- mc mc 'this machine' %{install}
    ensure: *ensure
    install: *install
    command: mc /sh://%t/
  - name: Bash
    key: Alt+B
    prepare_command: *prepare_ssh
    ensure: *ensure
    install: *install
    command: port=%p; exec ssh ${port:+-p "$port"} -tt -- %h %{launch_remote}
    launch_remote: sh -c %{script}
    script: |
      sh -c %{ensure} -- bash bash 'the remote' %{install} || exit $?
      exec sh -c %{remote}
    remote: exec bash -l
  - name: Zellij
    key: Alt+Z
    prepare_command: *prepare_ssh
    ensure: *ensure
    install: *install
    command: port=%p; exec ssh ${port:+-p "$port"} -tt -- %h %{remote}
    remote: sh -c %{script}
    script: |
      #!/bin/sh
      # Runs on the SSH server with its terminal still attached to stdin.
      set -eu
      fail() { printf 'shui: %s\n' "$*" >&2; exit 1; }

      if command -v zellij >/dev/null 2>&1; then
          zellij_bin=$(command -v zellij)
      elif [ -x "$HOME/.local/bin/zellij" ]; then
          zellij_bin=$HOME/.local/bin/zellij
      else
          printf 'Zellij is missing on the remote. Install into ~/.local/bin? [y/N] ' >&2
          IFS= read -r answer || exit 1
          case "$answer" in y|Y|yes|YES) ;; *) fail 'installation cancelled' ;; esac
          case "$(uname -s):$(uname -m)" in
              Linux:x86_64)
                  platform=x86_64-unknown-linux-musl
                  expected=d006c521dcb475a6005d741e9dd7c5758e5a23b28dd60a5c10cebfa4876319dd
                  ;;
              Linux:aarch64|Linux:arm64)
                  platform=aarch64-unknown-linux-musl
                  expected=2a2c0621e6f3b11ecbb05d66939a48000a2508604620aa20727a5fd61c49f451
                  ;;
              *) fail 'automatic Zellij installation supports Linux x86-64/ARM64; install zellij manually on this platform' ;;
          esac
          command -v tar >/dev/null 2>&1 || fail 'tar is required to install Zellij'
          if command -v sha256sum >/dev/null 2>&1; then
              checksum=sha256sum
          elif command -v shasum >/dev/null 2>&1; then
              checksum=shasum
          else
              fail 'sha256sum or shasum is required to verify Zellij'
          fi
          umask 077
          mkdir -p "$HOME/.local/bin"
          install_dir=$(mktemp -d "$HOME/.local/bin/.shui-zellij.XXXXXX")
          trap 'rm -rf "$install_dir"' 0
          trap 'exit 1' HUP INT TERM
          archive=$install_dir/zellij.tar.gz
          url=https://github.com/zellij-org/zellij/releases/download/v0.45.1/zellij-$platform.tar.gz
          printf 'Installing Zellij 0.45.1 into %s/.local/bin ...\n' "$HOME" >&2
          if command -v curl >/dev/null 2>&1; then
              curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --location \
                  --retry 2 --connect-timeout 15 --max-time 180 --silent --show-error \
                  --output "$archive" "$url" || fail 'Zellij download failed'
          elif command -v wget >/dev/null 2>&1; then
              wget --https-only --timeout=30 --tries=2 -q -O "$archive" "$url" || fail 'Zellij download failed'
          else
              fail 'curl or wget is required to download Zellij'
          fi
          # Official .sha256sum assets hash the executable, not the tarball.
          tar -xzf "$archive" -C "$install_dir" zellij || fail 'cannot extract Zellij'
          [ -f "$install_dir/zellij" ] && [ ! -L "$install_dir/zellij" ] || fail 'invalid Zellij archive member'
          if [ "$checksum" = sha256sum ]; then
              digest=$(sha256sum "$install_dir/zellij")
          else
              digest=$(shasum -a 256 "$install_dir/zellij")
          fi
          [ "${digest%% *}" = "$expected" ] || fail 'Zellij checksum mismatch; refusing to install or execute it'
          chmod 755 "$install_dir/zellij"
          mv -f "$install_dir/zellij" "$HOME/.local/bin/zellij"
          rm -rf "$install_dir"
          trap - 0 HUP INT TERM
          zellij_bin=$HOME/.local/bin/zellij
      fi

      # Names are returned without formatting, oldest session first. Keep spaces intact.
      # When no sessions exist, list-sessions returns nonzero; attach --create handles it.
      if sessions=$("$zellij_bin" list-sessions --short --no-formatting 2>/dev/null); then
          session=$(printf '%s\n' "$sessions" | sed -n '1p')
          if [ -n "$session" ]; then
              exec "$zellij_bin" attach --create "$session"
          fi
      fi
      exec "$zellij_bin" attach --create

  # Persistent sessions, file transfers, monitoring and SSH forwarding.
  - name: Tmux
    key: Alt+T
    prepare_command: *prepare_ssh
    ensure: *ensure
    install: *install
    command: port=%p; exec ssh ${port:+-p "$port"} -tt -- %h %{launch_remote}
    launch_remote: sh -c %{script}
    script: |
      sh -c %{ensure} -- tmux tmux 'the remote' %{install} || exit $?
      exec sh -c %{remote}
    remote: exec tmux new-session -A -s main
  - name: SFTP
    key: Alt+F
    prepare_command: sh -c %{ensure} -- sftp openssh 'this machine' %{install}
    ensure: *ensure
    install: *install
    command: port=%p; exec sftp ${port:+-P "$port"} -- %h
  - name: Monitor
    key: Alt+H
    prepare_command: *prepare_ssh
    ensure: *ensure
    install: *install
    command: port=%p; exec ssh ${port:+-p "$port"} -tt -- %h %{remote}
    remote: sh -c %{script} -- %{dashboard} %{ensure} %{install}
    # A compact health overview. Press 4 in btop to toggle the process list,
    # i for disk read/write graphs, and n/b to cycle network interfaces.
    dashboard: |
      shown_boxes = "cpu mem net"
      update_ms = 1000
      theme_background = false
      graph_symbol = "block"
      show_uptime = true
      check_temp = true
      show_gpu_info = "On"
      show_disks = true
      only_physical = false
      disks_filter = "exclude=/proc /dev /dev/pts /dev/shm /sys /sys/fs/cgroup /run /run/lock"
      use_fstab = false
      show_io_stat = true
      io_mode = false
      net_auto = true
      show_swap = true
    script: |
      set -eu
      sh -c "$2" -- btop btop 'the remote' "$3" || exit $?
      # Isolate the dashboard from the user's regular btop configuration.
      umask 077
      config_dir=$(mktemp -d "${TMPDIR:-/tmp}/shui-monitor.XXXXXX")
      trap 'rm -rf "$config_dir"' 0
      trap 'exit 1' HUP INT TERM
      mkdir -p "$config_dir/btop"
      printf '%s\n' "$1" > "$config_dir/btop/btop.conf"
      XDG_CONFIG_HOME="$config_dir" XDG_STATE_HOME="$config_dir" btop
  - name: Tunnel
    key: Ctrl+Alt+L
    inputs:
      - id: forward
        type: promptString
        description: Local port:destination host:port
        default: '8080:localhost:80'
        required: true
    # The destination is reached from the SSH server; listen only on loopback.
    prepare_command: *prepare_ssh
    ensure: *ensure
    install: *install
    command: |
      port=%p
      forward=%{input:forward}
      printf 'Forwarding 127.0.0.1:%s through SSH. Ctrl+C stops the tunnel.\n' "$forward"
      exec ssh ${port:+-p "$port"} -N -T -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -L "127.0.0.1:$forward" -- %h
  - name: SOCKS
    key: Ctrl+Alt+D
    inputs:
      - id: port
        type: promptString
        description: Local SOCKS port
        default: '1080'
        required: true
    prepare_command: *prepare_ssh
    ensure: *ensure
    install: *install
    command: |
      port=%p
      listen=%{input:port}
      printf 'SOCKS proxy on 127.0.0.1:%s. Ctrl+C stops the proxy.\n' "$listen"
      exec ssh ${port:+-p "$port"} -N -T -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -D "127.0.0.1:$listen" -- %h

# F4 configures the selected host; Shift+F4 opens Add new to add and connect.
# You can also switch between these modes using the Action field.
# Configure host runs one recipe and returns to the menu without saving history.
# None is selected by default; a recipe is required only in Configure host mode.
# Same command templates and named fields as launch profiles; runs locally.
configuration_scripts:
  - name: Configure key-based auth
    inputs:
      - &ssh_key
        id: key
        type: pickString
        description: SSH keypair
        required: true
        # Emit YAML. Only list public keys with a matching private-key file.
        command: |
          found=0
          printf 'options:\n'
          for public in "$HOME"/.ssh/id_*.pub; do
            [ -f "$public" ] && [ -f "${public%.pub}" ] || continue
            name=${public##*/}
            escaped=$(printf '%s' "$name" | sed "s/'/''/g")
            printf "  - '%s'\n" "$escaped"
            found=1
          done
          [ "$found" = 1 ] || printf "  - 'Generate new Ed25519 key'\n"
      - &ssh_key_expiry
        id: expiry
        type: pickString
        description: Key expiry
        options: [never, 8 hours, day, week, month, year]
        default: never
        # Durations start on the server after ssh-copy-id: month = 30 days,
        # year = 365 days. UTC avoids local time-zone / daylight-saving ambiguity.
        # never removes expiry-time from this key; it does not remove other options.
    command: sh -c %{setup_script} -- %h %p %{prepare_key} %{input:key} %{expiry_remote}
    setup_script: |
      set -eu
      host=$1
      port=$2
      key=$(sh -c "$3" -- "$4")
      ssh-copy-id ${port:+-p "$port"} -i "$key" "$host"
      cat "$key" | ssh ${port:+-p "$port"} -i "${key%.pub}" -- "$host" "$5"
    expiry_remote: &ssh_key_expiry_remote sh -c %{set_expiry} -- %{input:expiry}
    # Update every occurrence of the selected key in the standard authorized_keys.
    # Preserve other keys, comments, and options (including quoted commas/spaces).
    # Custom AuthorizedKeysFile/Command layouts need a custom recipe.
    set_expiry: &set_ssh_key_expiry |
      set -eu
      case "$1" in
        never) seconds=0 ;;
        '8 hours') seconds=28800 ;;
        day) seconds=86400 ;;
        week) seconds=604800 ;;
        month) seconds=2592000 ;;
        year) seconds=31536000 ;;
        *) echo 'Unknown key expiry.' >&2; exit 1 ;;
      esac
      expiry=
      if [ "$seconds" -ne 0 ]; then
        deadline=$(( $(date +%s) + seconds ))
        expiry=$(date -u -d "@$deadline" +%Y%m%d%H%M%SZ 2>/dev/null) ||
          expiry=$(date -u -r "$deadline" +%Y%m%d%H%M%SZ)
      fi
      read -r key_type key_blob comment || :
      [ -n "$key_type" ] && [ -n "$key_blob" ] || exit 1
      file="$HOME/.ssh/authorized_keys"
      [ -f "$file" ] && [ ! -L "$file" ] || {
        echo 'Expected a regular ~/.ssh/authorized_keys file.' >&2; exit 1;
      }
      umask 077
      work=$(mktemp -d "$HOME/.ssh/.shui-expiry.XXXXXX")
      trap 'rm -rf "$work"' 0
      trap 'exit 1' HUP INT TERM
      cp "$file" "$work/original"
      awk -v key_type="$key_type" -v key_blob="$key_blob" -v expiry="$expiry" '
        # Find a separator outside double quotes, respecting backslash escapes.
        function boundary(s, commas,    i,c,quoted,escaped) {
          for (i=1; i<=length(s); i++) {
            c=substr(s,i,1)
            if (escaped) { escaped=0; continue }
            if (c=="\\") { escaped=1; continue }
            if (c=="\"") { quoted=!quoted; continue }
            if (!quoted && (commas ? c=="," : c ~ /[ \t]/)) return i
          }
          return length(s)+1
        }
        function token(    n,t) {
          sub(/^[ \t]+/, "", rest)
          n=boundary(rest,0); t=substr(rest,1,n-1)
          rest=substr(rest,n); return t
        }
        /^[ \t]*(#|$)/ { print; next }
        {
          original=$0; rest=$0; options=""; kind=token()
          if (kind!=key_type) { options=kind; kind=token() }
          blob=token()
          if (kind!=key_type || blob!=key_blob) { print original; next }
          found=1; kept=""
          while (length(options)) {
            n=boundary(options,1); option=substr(options,1,n-1)
            options=substr(options,n+1)
            if (option !~ /^expiry-time=/)
              kept=kept (length(kept) ? "," : "") option
          }
          if (length(expiry)) kept=kept (length(kept) ? "," : "") "expiry-time=\"" expiry "\""
          print (length(kept) ? kept " " : "") kind " " blob rest
        }
        END { if (!found) exit 1 }
      ' "$work/original" > "$work/updated" || {
        echo 'Could not find the installed key in ~/.ssh/authorized_keys.' >&2; exit 1;
      }
      cmp -s "$file" "$work/original" || {
        echo 'authorized_keys changed during setup; retry.' >&2; exit 1;
      }
      chmod 600 "$work/updated"
      mv "$work/updated" "$file"
      printf 'Key expiry: %s%s\n' "$1" "${expiry:+ ($expiry UTC)}"
    # Only runs after confirming setup, with the terminal restored for prompts.
    prepare_key: &prepare_ssh_key |
      set -eu
      if [ "$1" = 'Generate new Ed25519 key' ]; then
        private="$HOME/.ssh/id_ed25519"
        for file in "$private" "$private.pub"; do
          if [ -e "$file" ] || [ -L "$file" ]; then
            echo "Cannot generate a new key: $file already exists. Restore the matching key file or select another keypair." >&2
            exit 1
          fi
        done
        umask 077
        mkdir -p "$HOME/.ssh"
        echo "Generating $private (ssh-keygen will ask for a passphrase)." >&2
        ssh-keygen -q -t ed25519 -f "$private" >&2
        public="$private.pub"
      else
        public="$HOME/.ssh/$1"
      fi
      [ -f "$public" ] && [ -f "${public%.pub}" ] || {
        echo "Missing SSH keypair: $public" >&2
        exit 1
      }
      printf '%s\n' "$public"
  - name: Configure key-based auth + install dotfiles
    prepare_key: *prepare_ssh_key
    expiry_remote: *ssh_key_expiry_remote
    set_expiry: *set_ssh_key_expiry
    # Relative source paths are resolved under local $HOME.
    inputs:
      - *ssh_key
      - *ssh_key_expiry
      - id: source
        type: promptString
        description: Local dotfiles directory
        default: src/dotfiles
        required: true
      - id: installer
        type: promptString
        description: Installer filename
        default: install.sh
        required: true
      - id: shell
        type: pickString
        description: Installer shell
        options: [sh, bash]
        default: sh
    command: sh -c %{setup_script} -- %h %p %{prepare_key} %{input:key} %{expiry_remote} %{input:source} %{input:installer} %{remote}
    setup_script: |
      set -eu
      host=$1
      port=$2
      source=$6
      installer=$7
      case "$source" in /*) ;; *) source="$HOME/$source" ;; esac
      test -f "$source/$installer" || { echo "Missing $source/$installer" >&2; exit 1; }
      key=$(sh -c "$3" -- "$4")
      ssh-copy-id ${port:+-p "$port"} -i "$key" "$host"
      cat "$key" | ssh ${port:+-p "$port"} -i "${key%.pub}" -- "$host" "$5"
      ssh ${port:+-p "$port"} -i "${key%.pub}" -- "$host" 'mkdir -p "$HOME/src/dotfiles"'
      scp ${port:+-P "$port"} -i "${key%.pub}" -r "$source/." "$host:src/dotfiles/"
      ssh ${port:+-p "$port"} -i "${key%.pub}" -tt -- "$host" "$8"
    remote: sh -c %{script} -- %{input:installer} %{input:shell}
    script: |
      set -eu
      cd "$HOME/src/dotfiles"
      exec "$2" "./$1"
  - name: Copy terminal definition
    available_command: command -v ssh && command -v infocmp && test -n "${TERM:-}"
    # Export before connecting so a failed infocmp cannot send a partial definition.
    command: sh -c %{export_script} -- %h %p %{remote}
    export_script: |
      set -eu
      port=$2
      definition=$(infocmp -x -- "$TERM")
      printf '%s\n' "$definition" | ssh ${port:+-p "$port"} -- "$1" "$3"
    remote: sh -c %{script}
    script: |
      set -eu
      command -v tic >/dev/null 2>&1 || {
        echo 'Install ncurses tic on the remote first.' >&2
        exit 1
      }
      umask 077
      source=$(mktemp "${TMPDIR:-/tmp}/shui-terminfo.XXXXXX")
      trap 'rm -f "$source"' 0
      trap 'exit 1' HUP INT TERM
      cat > "$source"
      mkdir -p "$HOME/.terminfo"
      tic -x -o "$HOME/.terminfo" "$source"

# Custom profiles and recipes (merge into the named sections above; these
# commented fragments are not active). Fields display plain text, not passwords.
# Inputs: id (unique letters/digits/_/-), type (promptString or pickString),
# description, default, required, options (pickString only), command (generator).
# promptString defaults to empty; pickString defaults to its first option.
# Generators emit a YAML/JSON mapping of default/options/description (max 64 KiB).
# Successful values are cached while a dialog is open; errors block submission.
# Generators run locally with stdin closed and no placeholder substitution.
# Pass remote inputs as positional arguments through remote/script quoting layers.
# Input values are temporary and never saved to YAML or history.

